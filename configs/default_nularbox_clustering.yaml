## Required arguments per run are not given here

## ---- basic job setup ----
num_workers: 8
seed: 12345
state_file: state.pth
log: log

## ---- training dynamics ----
lr: 1.0e-3
batch_size: 4096
optimizer: adam
scheduler: onecycle
lars_trust_coeff: 0.001
lars_momentum: 0.9
dropout: 0.0
weight_decay: 0
weight_decay_final: -1.0   # -1 -> no WD schedule
weight_decay_head: 1
norm_encoder: 0
non_lars_lr_scale: 0.03

## ---- image size and augmentations ----
aug_type: v1m
aug_prob: 1.0
aug_val: 0.0

## ---- Contrastive clustering head ----
clust_arch: twobn
clust_temp: 0.5
nclusters: 100
nhidden: 2048
entropy_scale: 1.0

## ---- Monitoring ----
monitor_nbank: 100000
monitor_nquery: 100000
monitor_k: 20

## ---- profiling / logging ----
run_profiler: 0
